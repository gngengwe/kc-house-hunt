<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Details — KC House Hunt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080d17;
      --bg-1:    #0e1525;
      --bg-2:    #141e30;
      --bg-3:    #1a2540;
      --border:  #1e2e47;
      --border2: #253553;
      --text:    #e2e8f5;
      --muted:   #7a91b8;
      --dim:     #3d5278;
      --purple:  #c084fc;
      --blue:    #60a5fa;
      --amber:   #fbbf24;
      --gray:    #64748b;
      --green:   #34d399;
      --red:     #f87171;
    }
    * { box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); margin:0; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--bg-1); }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

    /* ── Collapsible panel ── */
    .panel { background:var(--bg-1); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .panel-btn { width:100%; display:flex; align-items:center; justify-content:space-between;
      padding:13px 18px; cursor:pointer; background:none; border:none; color:var(--text);
      font-size:14px; font-weight:700; font-family:inherit; text-align:left; transition:background 0.15s; }
    .panel-btn:hover { background:var(--bg-2); }
    .panel-btn .chevron { flex-shrink:0; transition:transform 0.25s ease; color:var(--dim); }
    .panel-btn.open .chevron { transform:rotate(180deg); }
    .panel-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows 0.3s ease; }
    .panel-body.open { grid-template-rows:1fr; }
    .panel-inner { overflow:hidden; }

    /* ── Quote card ── */
    .quote-card { background:var(--bg-2); border:1px solid var(--border); border-radius:10px;
      padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
    .quote-text { font-size:14px; font-style:italic; color:var(--text); line-height:1.6; }
    .quote-text::before { content:'"'; font-size:20px; line-height:0; vertical-align:-6px; margin-right:3px; }
    .quote-text::after  { content:'"'; font-size:20px; line-height:0; vertical-align:-6px; margin-left:3px; }
    .quote-meta { font-size:11px; color:var(--muted); font-weight:500; }
    .quote-ctx  { font-size:11px; color:var(--dim); margin-top:1px; }

    /* status accent for quote left border */
    .ql-top    { border-left:3px solid var(--purple); }
    .ql-solid  { border-left:3px solid var(--blue); }
    .ql-watch  { border-left:3px solid var(--amber); }
    .ql-pass   { border-left:3px solid var(--gray); }

    /* ── Feature / concern row ── */
    .fc-item { display:flex; gap:8px; align-items:flex-start; padding:5px 0;
      border-bottom:1px solid var(--bg-3); font-size:13px; line-height:1.5; }
    .fc-item:last-child { border-bottom:none; }
    .fc-dot { flex-shrink:0; font-size:11px; margin-top:3px; }

    /* ── Mech row ── */
    .mech-row { display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:9px 0; border-bottom:1px solid var(--bg-3); font-size:13px; }
    .mech-row:last-child { border-bottom:none; }
    .mech-name { color:var(--muted); flex-shrink:0; }
    .mech-val  { text-align:right; font-weight:500; }

    /* ── Stat pill ── */
    .stat-pill { background:var(--bg-2); border:1px solid var(--border); color:var(--muted);
      font-size:12px; padding:4px 10px; border-radius:99px; display:inline-flex;
      align-items:center; gap:4px; white-space:nowrap; }
    .stat-good { color:var(--green); border-color:rgba(52,211,153,0.25); background:rgba(52,211,153,0.07); }
    .stat-bad  { color:var(--red);   border-color:rgba(248,113,113,0.25); background:rgba(248,113,113,0.07); }

    /* ── Badge ── */
    .badge-top   { background:rgba(192,132,252,0.15); color:var(--purple); border:1px solid rgba(192,132,252,0.3); }
    .badge-solid { background:rgba(96,165,250,0.15);  color:var(--blue);   border:1px solid rgba(96,165,250,0.3); }
    .badge-watch { background:rgba(251,191,36,0.15);  color:var(--amber);  border:1px solid rgba(251,191,36,0.3); }
    .badge-pass  { background:rgba(100,116,139,0.12); color:var(--gray);   border:1px solid rgba(100,116,139,0.25); }

    /* ── Giscus dark theme override ── */
    .giscus-frame { color-scheme: dark; }
  </style>
</head>
<body>

<!-- ─── HEADER ──────────────────────────────────────────── -->
<header style="background:rgba(8,13,23,0.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;">
  <div style="max-width:800px;margin:0 auto;padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="font-size:13px;font-weight:600;color:var(--muted);
      text-decoration:none;display:flex;align-items:center;gap:6px;">
      ← All Houses
    </a>
    <a href="add-house.html" style="background:var(--blue);color:#fff;font-size:12px;font-weight:600;
      padding:7px 14px;border-radius:8px;text-decoration:none;">
      + Add a House
    </a>
  </div>
</header>

<main style="max-width:800px;margin:0 auto;padding:24px 16px 48px;">

  <!-- ─── HOUSE CONTENT ──────────────────────────────────── -->
  <div id="house-content">
    <div style="color:var(--dim);text-align:center;padding:64px;font-size:14px;">Loading…</div>
  </div>

  <!-- ─── COMMENTS ───────────────────────────────────────── -->
  <section style="margin-top:40px;" id="comments">
    <div style="margin-bottom:16px;">
      <h2 style="font-size:17px;font-weight:700;margin-bottom:4px;">💬 Family Discussion</h2>
      <p style="font-size:12px;color:var(--muted);">
        Share your thoughts, questions, or concerns about this house.
        You'll need a free
        <a href="https://github.com/signup" target="_blank" style="color:var(--blue);">GitHub account</a>
        to comment — takes 2 minutes.
      </p>
    </div>

    <!--
      SETUP GISCUS (one-time, ~5 min):
        1. Go to https://giscus.app
        2. Enter "gngengwe/kc-house-hunt" — Discussions are already enabled
        3. Page Mapping → URL
        4. Copy the data-repo-id and data-category-id values
        5. Replace REPLACE_WITH_REPO_ID and REPLACE_WITH_CATEGORY_ID below
        6. Push to GitHub — comments appear instantly
    -->
    <script src="https://giscus.app/client.js"
      data-repo="gngengwe/kc-house-hunt"
      data-repo-id="REPLACE_WITH_REPO_ID"
      data-category="General"
      data-category-id="REPLACE_WITH_CATEGORY_ID"
      data-mapping="url"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="dark_dimmed"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  </section>

</main>

<!-- ─── FOOTER ─────────────────────────────────────────── -->
<footer style="background:var(--bg-1);border-top:1px solid var(--border);">
  <div style="max-width:800px;margin:0 auto;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="font-size:12px;color:var(--dim);text-decoration:none;">← All Houses</a>
    <a href="add-house.html" style="font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;">
      + Add a house →
    </a>
  </div>
</footer>

<!-- ─── JS ────────────────────────────────────────────── -->
<script>
const CHV = `<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;

function togglePanel(btn) {
  const body = btn.nextElementSibling;
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  btn.classList.toggle('open', !open);
}

const S = {
  'top-pick': { label:'🥇 Top Pick', badge:'badge-top',   ql:'ql-top',   accent:'var(--purple)', border:'rgba(192,132,252,0.35)' },
  'solid':    { label:'🥈 Solid',    badge:'badge-solid', ql:'ql-solid', accent:'var(--blue)',   border:'rgba(96,165,250,0.25)'  },
  'watch':    { label:'👀 Watch',    badge:'badge-watch', ql:'ql-watch', accent:'var(--amber)',  border:'rgba(251,191,36,0.25)'  },
  'pass':     { label:'⏭ Pass',     badge:'badge-pass',  ql:'ql-pass',  accent:'var(--gray)',   border:'var(--border)'          },
};

function mechColor(age) {
  if (!age) return { c:'var(--dim)', icon:'❓', label:'Unknown' };
  if (age <= 3)  return { c:'var(--green)', icon:'✅', label:`${age} yrs — excellent` };
  if (age <= 7)  return { c:'var(--blue)',  icon:'👍', label:`${age} yrs — good` };
  if (age <= 12) return { c:'var(--amber)', icon:'⚠️', label:`${age} yrs — aging` };
  return             { c:'var(--red)',   icon:'🔴', label:`${age} yrs — replace soon` };
}

async function loadHouse() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location.href = 'index.html'; return; }

  let houses;
  try { houses = await fetch('./data/houses.json').then(r => r.json()); }
  catch(e) {
    document.getElementById('house-content').innerHTML =
      `<div style="color:var(--red);text-align:center;padding:48px;font-size:13px;">
        Could not load data. <a href="index.html" style="color:var(--blue);">← Back</a></div>`;
    return;
  }

  const h = houses.find(x => x.id === id);
  if (!h) {
    document.getElementById('house-content').innerHTML =
      `<div style="color:var(--muted);text-align:center;padding:48px;font-size:13px;">
        House not found. <a href="index.html" style="color:var(--blue);">← Back to all houses</a></div>`;
    return;
  }

  document.title = `${h.nickname} — KC House Hunt`;
  render(h);
  buildNav(h, houses);
}

function render(h) {
  const s     = S[h.status] || S['pass'];
  const price = h.price ? '$' + h.price.toLocaleString() : 'Price TBD';

  /* ── Stats strip ────────────────────────────────────── */
  const stats = [
    h.beds  != null ? `<span class="stat-pill"">🛏 ${h.beds} bed</span>` : '',
    h.baths != null ? `<span class="stat-pill ${+h.baths >= 1.5 ? 'stat-good' : 'stat-bad'}">🛁 ${h.baths} bath</span>` : '',
    h.stories ? `<span class="stat-pill">🏢 ${h.stories} floors</span>` : '',
    h.yearBuilt ? `<span class="stat-pill">🏚 Built ${h.yearBuilt}</span>` : '',
    h.pool   ? `<span class="stat-pill stat-good">🏊 Pool</span>` : '',
    h.garage ? `<span class="stat-pill stat-good">🚗 Garage</span>` : '',
    h.price  ? `<span class="stat-pill">${price}</span>` : `<span class="stat-pill">💰 ${price}</span>`,
  ].filter(Boolean).join('');

  /* ── Quotes grid ────────────────────────────────────── */
  const quotesHTML = (h.quotes || []).length ? `
  <div class="panel" style="margin-bottom:10px;">
    <button class="panel-btn open" onclick="togglePanel(this)">
      <span>💬 From the Tour — Actual Recorded Quotes</span>${CHV}
    </button>
    <div class="panel-body open">
      <div class="panel-inner" style="padding:8px 16px 16px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding-top:8px;">
          ${(h.quotes || []).map(q => `
            <div class="quote-card ${s.ql}">
              <div class="quote-text">${q.text}</div>
              <div>
                <div class="quote-meta">— ${q.speaker}</div>
                <div class="quote-ctx">${q.context}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>` : '';

  /* ── Highlights & Concerns ──────────────────────────── */
  const hlHTML = (h.features || []).map(f =>
    `<div class="fc-item"><span class="fc-dot" style="color:var(--green);">●</span>
    <span style="color:var(--text);">${f}</span></div>`).join('');
  const cnHTML = (h.concerns || []).map(c =>
    `<div class="fc-item"><span class="fc-dot" style="color:var(--amber);">●</span>
    <span style="color:var(--muted);">${c}</span></div>`).join('');

  const hlcnHTML = (hlHTML || cnHTML) ? `
  <div class="panel" style="margin-bottom:10px;">
    <button class="panel-btn open" onclick="togglePanel(this)">
      <span>✅ Highlights &amp; ⚠️ Concerns</span>${CHV}
    </button>
    <div class="panel-body open">
      <div class="panel-inner" style="padding:6px 16px 16px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding-top:8px;">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
              color:var(--green);margin-bottom:6px;">Highlights</div>
            ${hlHTML || '<div style="color:var(--dim);font-size:12px;">None noted</div>'}
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
              color:var(--amber);margin-bottom:6px;">Concerns</div>
            ${cnHTML || '<div style="color:var(--dim);font-size:12px;">None noted</div>'}
          </div>
        </div>
      </div>
    </div>
  </div>` : '';

  /* ── Mechanicals ────────────────────────────────────── */
  const mechEntries = Object.entries(h.mechanicals || {});
  const mechHTML = mechEntries.length ? `
  <div class="panel" style="margin-bottom:10px;">
    <button class="panel-btn" onclick="togglePanel(this)">
      <span>🔧 Mechanicals &amp; Condition</span>${CHV}
    </button>
    <div class="panel-body">
      <div class="panel-inner" style="padding:4px 16px 14px;">
        <div style="padding-top:8px;">
          ${mechEntries.map(([name, val]) => {
            const m = mechColor(val.age);
            return `<div class="mech-row">
              <span class="mech-name">${name}</span>
              <span class="mech-val" style="color:${m.c};">${m.icon} ${m.label}${val.note ? ' — ' + val.note : ''}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>` : '';

  /* ── Verdict ────────────────────────────────────────── */
  const verdictHTML = h.verdict ? `
  <div class="panel" style="margin-bottom:10px;">
    <button class="panel-btn open" onclick="togglePanel(this)">
      <span>📋 Overall Assessment</span>${CHV}
    </button>
    <div class="panel-body open">
      <div class="panel-inner">
        <p style="padding:8px 18px 16px;font-size:13px;color:var(--muted);line-height:1.7;">${h.verdict}</p>
      </div>
    </div>
  </div>` : '';

  /* ── Notes ──────────────────────────────────────────── */
  const notesHTML = h.notes ? `
  <div class="panel" style="margin-bottom:10px;">
    <button class="panel-btn" onclick="togglePanel(this)">
      <span>📝 Notes &amp; Details</span>${CHV}
    </button>
    <div class="panel-body">
      <div class="panel-inner">
        <p style="padding:8px 18px 16px;font-size:13px;color:var(--muted);line-height:1.7;
          border-left:3px solid ${s.accent};margin:6px 16px 10px;">${h.notes}</p>
      </div>
    </div>
  </div>` : '';

  document.getElementById('house-content').innerHTML = `
    <!-- ── Hero ── -->
    <div style="background:var(--bg-1);border:1px solid ${s.border};border-radius:14px;
      overflow:hidden;margin-bottom:16px;">
      <!-- color line -->
      <div style="height:4px;background:linear-gradient(90deg,${s.accent},transparent);"></div>
      <div style="padding:18px 20px;">
        <!-- badge + visit date -->
        <div style="display:flex;align-items:center;justify-content:space-between;
          flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          <span class="${s.badge}" style="font-size:11px;font-weight:600;padding:3px 12px;
            border-radius:99px;">${s.label}</span>
          ${h.visitDate ? `<span style="font-size:11px;color:var(--dim);">Visited ${h.visitDate}</span>` : ''}
        </div>
        <!-- name + address -->
        <h1 style="font-size:26px;font-weight:800;line-height:1.15;margin-bottom:4px;">${h.nickname}</h1>
        ${h.tagline ? `<p style="font-size:13px;color:${s.accent};font-style:italic;margin-bottom:6px;">"${h.tagline}"</p>` : ''}
        <p style="font-size:12px;color:var(--dim);margin-bottom:14px;">
          ${h.address}
          ${h.zillowUrl ? ` · <a href="${h.zillowUrl}" target="_blank" style="color:var(--blue);">Zillow →</a>` : ''}
        </p>
        <!-- stats strip -->
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${stats}</div>
        <!-- reaction quote -->
        ${h.reaction ? `
          <div style="background:var(--bg-2);border-left:3px solid ${s.accent};
            padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;
            font-style:italic;color:var(--text);line-height:1.5;">${h.reaction}</div>` : ''}
      </div>
    </div>

    <!-- ── Collapsible Sections ── -->
    ${quotesHTML}
    ${hlcnHTML}
    ${mechHTML}
    ${verdictHTML}
    ${notesHTML}

    <!-- ── Prev/Next nav ── -->
    <div id="house-nav" style="display:flex;gap:10px;margin-top:16px;"></div>
  `;
}

async function buildNav(current, houses) {
  const ORDER = { 'top-pick':0, 'solid':1, 'watch':2, 'pass':3 };
  const sorted = [...houses].sort((a,b) => (ORDER[a.status]??9) - (ORDER[b.status]??9));
  const idx  = sorted.findIndex(h => h.id === current.id);
  const prev = sorted[idx - 1];
  const next = sorted[idx + 1];
  const nav  = document.getElementById('house-nav');
  if (!nav) return;
  const btn = (h, dir) => `
    <a href="house.html?id=${h.id}"
       style="flex:1;background:var(--bg-1);border:1px solid var(--border);border-radius:10px;
         padding:10px 14px;text-decoration:none;font-size:12px;color:var(--muted);
         display:block;text-align:${dir === 'prev' ? 'left' : 'right'};
         transition:border-color 0.15s,color 0.15s;"
       onmouseover="this.style.borderColor='var(--border2)';this.style.color='var(--text)'"
       onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
      ${dir === 'prev' ? '← ' + h.nickname : h.nickname + ' →'}
    </a>`;
  nav.innerHTML = [
    prev ? btn(prev, 'prev') : '<div style="flex:1"></div>',
    next ? btn(next, 'next') : '',
  ].join('');
}

loadHouse();
</script>
</body>
</html>
